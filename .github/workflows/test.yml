name: Test GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test page
        run: |
          echo "Creating test page..."
          mkdir -p test-build
          cat > test-build/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Page</title>
          </head>
          <body>
              <h1>GitHub Actions Test</h1>
              <p>If you can see this, GitHub Actions is working!</p>
              <p>Build time: $(date)</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./test-build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
